[project]
name = "forest-supply-forecast"
version = "0.1.0"
description = "Forecasting Swedish forest harvesting activity (avverkningsanmälningar) with TimesFM 3 and classical baselines on open data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustav Jeansson" }]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "streamlit>=1.36",
    "pyarrow>=15.0",
    "tabulate>=0.9",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# TimesFM 3 backends — installera EN av dessa (Apple Silicon: mlx rekommenderas)
timesfm-mlx = ["timesfm[mlx] @ git+https://github.com/google-research/timesfm.git"]
timesfm-torch = ["timesfm[torch] @ git+https://github.com/google-research/timesfm.git"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
